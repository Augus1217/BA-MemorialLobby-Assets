name: Build & Release Assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 2025.0819.0)'
        required: true
        type: string
      skip_download:
        description: 'Skip download step (use existing data)'
        required: false
        type: boolean
        default: false

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install ba-downloader UnityPy==1.25.0 Pillow

      - name: Install Node.js dependencies
        run: npm ci

      - name: Display disk space
        run: df -h / && echo "---" && free -h

      - name: Build assets
        env:
          WORK_DIR: /tmp/ba_build
        run: |
          ARGS="--version ${{ inputs.version }}"
          if [ "${{ inputs.skip_download }}" = "true" ]; then
            ARGS="$ARGS --skip-download --skip-extract"
          fi
          python3 scripts/build_assets.py $ARGS

      - name: Display output
        run: |
          echo "=== Output files ==="
          ls -lh /tmp/ba_build/out/
          echo "=== Total size ==="
          du -sh /tmp/ba_build/out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: "Assets v${{ inputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            /tmp/ba_build/out/assets-spine-*.tar.gz
            /tmp/ba_build/out/assets-voice-*.tar.gz
            /tmp/ba_build/out/assets-bgm-*.tar.gz
            /tmp/ba_build/out/assets-scene-*.tar.gz
            /tmp/ba_build/out/assets-data-*.tar.gz
            /tmp/ba_build/out/assets-intro-*.tar.gz
            /tmp/ba_build/out/assets-ui-*.tar.gz
            /tmp/ba_build/out/assets-students-*.tar.gz
            /tmp/ba_build/out/assets_version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/ba_build
